<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Five states of a searchable people interface</title>
  <desc id="desc">A shared search field appears above initial, loading, empty, success, and recoverable error result panels.</desc>
  <rect width="1200" height="680" rx="24" fill="#f7f4ee"/>
  <text x="64" y="76" fill="#18231f" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">One feature, five visible outcomes</text>
  <rect x="64" y="110" width="1072" height="84" rx="16" fill="#fff" stroke="#26352f" stroke-width="3"/>
  <text x="96" y="162" fill="#55645e" font-family="Inter, Arial, sans-serif" font-size="25">Search people</text>
  <rect x="916" y="126" width="196" height="52" rx="12" fill="#176b4e"/>
  <text x="1014" y="160" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Search</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(64 238)">
      <rect width="200" height="360" rx="18" fill="#fff" stroke="#26352f" stroke-width="3"/>
      <circle cx="100" cy="105" r="34" fill="#dfe6e2"/>
      <path d="M87 105h26M100 92v26" stroke="#52615b" stroke-width="6" stroke-linecap="round"/>
      <text x="100" y="183" text-anchor="middle" fill="#18231f" font-size="24" font-weight="700">Initial</text>
      <text x="100" y="224" text-anchor="middle" fill="#5a6963" font-size="19">Invite the first</text>
      <text x="100" y="251" text-anchor="middle" fill="#5a6963" font-size="19">search action</text>
    </g>
    <g transform="translate(282 238)">
      <rect width="200" height="360" rx="18" fill="#fff" stroke="#26352f" stroke-width="3"/>
      <circle cx="100" cy="106" r="38" fill="none" stroke="#d9e3df" stroke-width="13"/>
      <path d="M100 68a38 38 0 0 1 38 38" fill="none" stroke="#176b4e" stroke-width="13" stroke-linecap="round"/>
      <text x="100" y="183" text-anchor="middle" fill="#18231f" font-size="24" font-weight="700">Loading</text>
      <rect x="34" y="220" width="132" height="15" rx="7" fill="#e4e9e6"/>
      <rect x="34" y="251" width="105" height="15" rx="7" fill="#e4e9e6"/>
    </g>
    <g transform="translate(500 238)">
      <rect width="200" height="360" rx="18" fill="#fff" stroke="#26352f" stroke-width="3"/>
      <circle cx="100" cy="105" r="36" fill="#f2e8ca"/>
      <path d="M82 105h36" stroke="#9a7520" stroke-width="6" stroke-linecap="round"/>
      <text x="100" y="183" text-anchor="middle" fill="#18231f" font-size="24" font-weight="700">Empty</text>
      <text x="100" y="224" text-anchor="middle" fill="#5a6963" font-size="19">No matches</text>
      <text x="100" y="251" text-anchor="middle" fill="#5a6963" font-size="19">Suggest recovery</text>
    </g>
    <g transform="translate(718 238)">
      <rect width="200" height="360" rx="18" fill="#fff" stroke="#26352f" stroke-width="3"/>
      <text x="28" y="58" fill="#18231f" font-size="24" font-weight="700">Success</text>
      <g fill="#eef3f0">
        <rect x="24" y="88" width="152" height="62" rx="12"/>
        <rect x="24" y="168" width="152" height="62" rx="12"/>
        <rect x="24" y="248" width="152" height="62" rx="12"/>
      </g>
      <g fill="#176b4e">
        <circle cx="54" cy="119" r="16"/><circle cx="54" cy="199" r="16"/><circle cx="54" cy="279" r="16"/>
      </g>
      <g fill="#687771">
        <rect x="82" y="108" width="70" height="9" rx="4"/><rect x="82" y="126" width="50" height="8" rx="4"/>
        <rect x="82" y="188" width="70" height="9" rx="4"/><rect x="82" y="206" width="50" height="8" rx="4"/>
        <rect x="82" y="268" width="70" height="9" rx="4"/><rect x="82" y="286" width="50" height="8" rx="4"/>
      </g>
    </g>
    <g transform="translate(936 238)">
      <rect width="200" height="360" rx="18" fill="#fff" stroke="#26352f" stroke-width="3"/>
      <circle cx="100" cy="105" r="36" fill="#f8ded9"/>
      <path d="M100 84v27M100 126v2" stroke="#a93d31" stroke-width="7" stroke-linecap="round"/>
      <text x="100" y="183" text-anchor="middle" fill="#18231f" font-size="24" font-weight="700">Error</text>
      <text x="100" y="224" text-anchor="middle" fill="#5a6963" font-size="19">Explain failure</text>
      <rect x="50" y="264" width="100" height="44" rx="10" fill="#a93d31"/>
      <text x="100" y="293" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Retry</text>
    </g>
  </g>
</svg>
